<!-- ===== ВСТАВКА НА САЙТ: НАЧАЛО (скопируйте всё до метки «КОНЕЦ» в HTML-блок сайта) ===== -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Стиль BAZA Development: светлый фон, белые карточки 20px, тёмно-синий текст, красные акценты, «таблетки» */
#rassrochka-calc {
  --rc-page: #F5F8FB;
  --rc-text: #002346;
  --rc-muted: #5f7690;
  --rc-faint: #6C8DAF;
  --rc-line: #D8E6F4;
  --rc-bg: #FFFFFF;
  --rc-soft: #EDF6FF;
  --rc-red: #E20617;
  --rc-red-hover: #b50c20;
  --rc-red-soft: #fef3f3;
  --rc-ok: #4d7a00;
  --rc-ok-bg: rgba(135, 202, 0, 0.15);
  --rc-radius: 20px;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--rc-text);
  background: var(--rc-page);
  font-size: 15px;
  line-height: 1.45;
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 16px;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}
#rassrochka-calc *, #rassrochka-calc *::before, #rassrochka-calc *::after { box-sizing: border-box; }
#rassrochka-calc [hidden] { display: none !important; }
#rassrochka-calc h2 { font-size: 40px; line-height: 1.1; margin: 0; font-weight: 500; letter-spacing: -0.02em; text-wrap: balance; }
#rassrochka-calc h3 { font-size: 20px; line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
#rassrochka-calc .rc-brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
#rassrochka-calc .rc-brand-r { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
#rassrochka-calc .rc-nav { display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 100px; background: var(--rc-bg); color: var(--rc-text); box-shadow: inset 0 0 0 1px var(--rc-line); font-size: 15px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: box-shadow .15s, color .15s; }
#rassrochka-calc .rc-nav:hover { box-shadow: inset 0 0 0 1px var(--rc-red); color: var(--rc-red); }
#rassrochka-calc .rc-logo { display: block; line-height: 0; }
#rassrochka-calc .ipc-logo-svg { display: block; height: 52px; width: auto; }
#rassrochka-calc .rc-sub { color: var(--rc-muted); margin: 0 0 24px; max-width: 640px; font-size: 14px; }
#rassrochka-calc .rc-card { background: var(--rc-bg); border-radius: var(--rc-radius); padding: 24px; }

/* Исходные данные */
#rassrochka-calc .rc-inputs { display: grid; grid-template-columns: auto repeat(4, minmax(0, 1fr)); gap: 16px; align-items: end; }
#rassrochka-calc .rc-suffix { position: relative; }
#rassrochka-calc .rc-suffix input { padding-right: 40px; }
#rassrochka-calc .rc-suffix span { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--rc-muted); pointer-events: none; font-size: 15px; }
#rassrochka-calc label, #rassrochka-calc .rc-label { display: block; font-weight: 500; font-size: 13px; margin-bottom: 6px; color: var(--rc-muted); }
#rassrochka-calc input {
  width: 100%; height: 48px; padding: 0 16px; font: inherit; font-size: 15px; color: var(--rc-text);
  border: 1px solid var(--rc-line); border-radius: 12px; background: var(--rc-bg); margin: 0; transition: border-color .15s;
}
#rassrochka-calc input::placeholder { color: var(--rc-faint); }
#rassrochka-calc input:hover { border-color: var(--rc-faint); }
#rassrochka-calc input:focus { outline: none; border-color: var(--rc-text); box-shadow: 0 0 0 3px var(--rc-soft); }
#rassrochka-calc .rc-pills { display: flex; flex-wrap: wrap; gap: 8px; }
#rassrochka-calc .rc-pills button {
  font: inherit; font-size: 14px; border: 1px solid var(--rc-line); background: var(--rc-bg); color: var(--rc-text);
  padding: 0 18px; height: 48px; border-radius: 100px; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s;
}
#rassrochka-calc .rc-pills.rc-sm button { height: 36px; padding: 0 14px; font-size: 13px; }
#rassrochka-calc .rc-pills button:hover { border-color: var(--rc-faint); }
#rassrochka-calc .rc-pills button[aria-pressed="true"] { background: var(--rc-text); border-color: var(--rc-text); color: #FFFFFF; font-weight: 600; }
#rassrochka-calc button:focus-visible, #rassrochka-calc a:focus-visible { outline: 2px solid var(--rc-red); outline-offset: 2px; }

/* Карточки рассрочек */
#rassrochka-calc .rc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; align-items: start; }
#rassrochka-calc .rc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
#rassrochka-calc .rc-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 100px; white-space: nowrap; color: var(--rc-red); background: var(--rc-red-soft); }
#rassrochka-calc .rc-badge.rc-zero { color: var(--rc-muted); background: var(--rc-page); }
#rassrochka-calc .rc-desc { color: var(--rc-muted); font-size: 13px; margin: 0 0 14px; }
#rassrochka-calc .rc-total { background: var(--rc-text); color: #FFFFFF; border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px 28px; }
#rassrochka-calc .rc-total .rc-k { color: rgba(255, 255, 255, 0.7); font-size: 13px; }
#rassrochka-calc .rc-total .rc-v { font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
#rassrochka-calc .rc-total .rc-v.rc-sm { font-size: 20px; font-weight: 500; }
#rassrochka-calc .rc-pvpick { margin-bottom: 14px; }
#rassrochka-calc table { width: 100%; border-collapse: collapse; font-size: 14px; }
#rassrochka-calc th { color: var(--rc-faint); font-weight: 500; font-size: 12px; text-align: left; padding: 0 0 6px; border-bottom: 1px solid var(--rc-line); }
#rassrochka-calc th:last-child, #rassrochka-calc td:last-child { text-align: right; }
#rassrochka-calc td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--rc-line); vertical-align: top; font-variant-numeric: tabular-nums; }
#rassrochka-calc td:first-child { white-space: nowrap; color: var(--rc-muted); width: 1%; padding-right: 16px; }
#rassrochka-calc td:last-child { white-space: nowrap; font-weight: 600; padding-right: 0; }
#rassrochka-calc tr.rc-final td { font-weight: 700; color: var(--rc-text); }
#rassrochka-calc .rc-s2 { display: block; color: var(--rc-faint); font-size: 12px; font-weight: 400; }
#rassrochka-calc .rc-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--rc-muted); }
#rassrochka-calc .rc-meta b { color: var(--rc-text); font-weight: 600; }
#rassrochka-calc .rc-warn { margin-top: 10px; background: var(--rc-red-soft); color: var(--rc-red); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 500; }
#rassrochka-calc .rc-empty { color: var(--rc-muted); font-size: 14px; }
#rassrochka-calc .rc-foot { margin-top: 16px; display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 10px; }
#rassrochka-calc .rc-btn-main { background: var(--rc-red); color: #FFFFFF; box-shadow: none; font-weight: 600; transition: background .15s; }
#rassrochka-calc .rc-btn-main:hover { background: var(--rc-red-hover); box-shadow: none; }
#rassrochka-calc .rc-btn:disabled { opacity: .6; cursor: progress; }
#rassrochka-calc .rc-savemsg { font-size: 13px; color: var(--rc-red); max-width: 420px; }
#rassrochka-calc .rc-savemsg:empty { display: none; }

/* Отчёт для PDF (A4 книжный). Собирается отдельно от экрана; без tabular-nums — html2canvas их не поддерживает */
.rc-report { box-sizing: border-box; width: 794px; min-height: 1123px; padding: 28px 30px; background: #F5F8FB; color: #002346;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
.rc-report * { box-sizing: border-box; }
.rc-report .rr-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 12px; }
.rc-report .rr-title { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.rc-report .rr-meta { font-size: 12px; color: #5f7690; margin-top: 4px; }
.rc-report .rr-logo { display: block; height: 40px; width: auto; }
.rc-report .rr-inputs { display: flex; gap: 24px; background: #FFFFFF; border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; }
.rc-report .rr-inputs div { font-size: 11px; color: #5f7690; }
.rc-report .rr-inputs b { display: block; font-size: 14px; color: #002346; font-weight: 600; margin-top: 2px; }
.rc-report .rr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
.rc-report .rc-card { background: #FFFFFF; border-radius: 14px; padding: 14px 16px; }
.rc-report .rc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.rc-report h3 { font-size: 15px; font-weight: 700; margin: 0; }
.rc-report .rc-badge { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 100px; white-space: nowrap; color: #E20617; background: #fef3f3; }
.rc-report .rc-badge.rc-zero { color: #5f7690; background: #F5F8FB; }
.rc-report .rc-desc { color: #5f7690; font-size: 11px; margin: 0 0 8px; }
.rc-report .rc-desc b { color: #002346; }
.rc-report .rc-total { background: #002346; color: #FFFFFF; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 20px; }
.rc-report .rc-k { color: rgba(255, 255, 255, 0.7); font-size: 10.5px; }
.rc-report .rc-v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; line-height: 1.2; }
.rc-report .rc-v.rc-sm { font-size: 15px; font-weight: 500; }
.rc-report table { width: 100%; border-collapse: collapse; font-size: 11px; }
.rc-report th { color: #6C8DAF; font-weight: 500; font-size: 10px; text-align: left; padding: 0 0 4px; border-bottom: 1px solid #D8E6F4; }
.rc-report th:last-child, .rc-report td:last-child { text-align: right; }
.rc-report td { padding: 5px 6px 5px 0; border-bottom: 1px solid #D8E6F4; vertical-align: top; }
.rc-report td:first-child { white-space: nowrap; color: #5f7690; width: 1%; padding-right: 10px; }
.rc-report td:last-child { white-space: nowrap; font-weight: 600; padding-right: 0; }
.rc-report tr.rc-final td { font-weight: 700; color: #002346; }
.rc-report .rc-s2 { display: block; color: #6C8DAF; font-size: 10px; font-weight: 400; }
.rc-report .rc-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 11px; color: #5f7690; }
.rc-report .rc-meta b { color: #002346; }
.rc-report .rc-warn { margin-top: 6px; color: #E20617; font-size: 11px; }
.rc-report .rr-foot { margin-top: 10px; font-size: 10px; color: #6C8DAF; }
#rassrochka-calc .rc-btn { font: inherit; font-size: 14px; font-weight: 500; border: 0; background: var(--rc-bg); color: var(--rc-text); box-shadow: inset 0 0 0 1px var(--rc-line); border-radius: 100px; padding: 0 24px; height: 44px; cursor: pointer; }
#rassrochka-calc .rc-btn:hover { box-shadow: inset 0 0 0 1px var(--rc-faint); }

@media (prefers-reduced-motion: reduce) { #rassrochka-calc * { transition: none !important; } }
@media (max-width: 960px) {
  #rassrochka-calc .rc-inputs { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #rassrochka-calc .rc-inputs .rc-f-project { grid-column: 1 / -1; }
  #rassrochka-calc .rc-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  #rassrochka-calc { padding: 16px; }
  #rassrochka-calc h2 { font-size: 28px; }
  #rassrochka-calc .ipc-logo-svg { height: 38px; }
  /* Телефон: заголовок и логотип в первой строке, кнопка «Ипотечный калькулятор» — второй строкой */
  #rassrochka-calc .rc-brand { flex-wrap: wrap; gap: 10px 12px; }
  #rassrochka-calc .rc-brand h2 { flex: 1 1 160px; }
  #rassrochka-calc .rc-brand-r { display: contents; }
  #rassrochka-calc .rc-logo { order: 2; }
  #rassrochka-calc .rc-nav { order: 3; height: 36px; padding: 0 14px; font-size: 13px; }
  #rassrochka-calc .rc-card { padding: 18px; }
  #rassrochka-calc .rc-inputs { grid-template-columns: minmax(0, 1fr); }
  #rassrochka-calc .rc-total .rc-v { font-size: 24px; }
  #rassrochka-calc table { font-size: 13px; }
  #rassrochka-calc td { padding-right: 6px; }
  #rassrochka-calc td:first-child { padding-right: 8px; }
}
@page { size: A4 portrait; margin: 10mm; }
@media print {
  #rassrochka-calc { background: #FFFFFF; padding: 0; max-width: none; font-size: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #rassrochka-calc .rc-nav, #rassrochka-calc .rc-sub, #rassrochka-calc .rc-foot { display: none !important; }
  #rassrochka-calc h2 { font-size: 26px; }
  #rassrochka-calc .ipc-logo-svg { height: 38px; }
  #rassrochka-calc .rc-card { border: 1px solid var(--rc-line); padding: 12px 14px; break-inside: avoid; page-break-inside: avoid; }
  #rassrochka-calc .rc-inputs { grid-template-columns: auto 1fr 1fr 1fr 1fr; gap: 10px; }
  #rassrochka-calc input, #rassrochka-calc .rc-pills button { height: 30px; font-size: 12px; }
  #rassrochka-calc .rc-grid { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  #rassrochka-calc .rc-total { padding: 10px 12px; margin-bottom: 8px; }
  #rassrochka-calc .rc-total .rc-v { font-size: 20px; }
  #rassrochka-calc .rc-total .rc-v.rc-sm { font-size: 15px; }
  #rassrochka-calc table { font-size: 11px; }
  #rassrochka-calc td { padding: 4px 6px 4px 0; }
}
</style>

<script>
(function () {
  'use strict';

  /* ================== НАСТРОЙКИ ================== */
  var CONFIG = Object.assign({
    // ID Google Таблицы. Таблица должна быть доступна «всем, у кого есть ссылка» (просмотр).
    sheetId: '13obtdqMiDQv0a_7CC7b0LsY2UZJA_xFZd6JtBN3uDRk',

  }

  // forPdf — версия карточки для отчёта: без кнопок выбора ПВ, выбранный ПВ указан текстом
  function card(key, c, P, forPdf) {
    var html = '<div class="rc-card" data-k="' + key + '">' +
      '<div class="rc-head"><h3>' + esc(c.title) + '</h3><span class="rc-badge' + (c.disc || readInputs().extra ? '' : ' rc-zero') + '">' +
        discLabel(c.disc, readInputs().extra) + '</span></div>' +
      '<p class="rc-desc">' + esc(c.desc) + '</p>';
    if (c.pvPick && forPdf) {
      html += '<p class="rc-desc"><b>Первый платёж: ' + pct(state.pv[state.project]) + '</b></p>';
    } else if (c.pvPick) {
      var opts = pvOptions(P);
      html += '<div class="rc-pvpick"><span class="rc-label">Первый платёж</span><div class="rc-pills rc-sm" data-pv>' +
        opts.map(function (v) {
          return '<button type="button" data-v="' + v + '" aria-pressed="' + (Math.abs(v - state.pv[state.project]) < 1e-9) + '">' + pct(v) +
            ' · скидка ' + pct(lookupDisc(P.m5050.matrix, v)) + '</button>';
        }).join('') + '</div></div>';
    }
    var discRub = readInputs().base + readInputs().finish - c.total;
    html += '<div class="rc-total"><div><div class="rc-k">Итоговая стоимость</div><div class="rc-v">' + rub(c.total) + '</div></div>' +
      (discRub > 0.5 ? '<div><div class="rc-k">Скидка</div><div class="rc-v rc-sm">' + rub(discRub) + '</div></div>' : '') + '</div>';
    html += '<table><thead><tr><th>Дата</th><th>Платёж</th><th>Сумма</th></tr></thead><tbody>' +
      c.rows.map(function (r) {
        return '<tr' + (r[4] ? ' class="rc-final"' : '') + '><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '<span class="rc-s2">' + esc(r[2]) + '</span></td><td>' + rub(r[3]) + '</td></tr>';
      }).join('') + '</tbody></table>';
    html += '<div class="rc-meta"><span>Срок рассрочки</span><b>' + (c.term != null ? c.term + ' ' + plural(c.term, 'месяц', 'месяца', 'месяцев') : esc(c.termText)) + '</b></div>';
    var last = c.rows[c.rows.length - 1][3];
    if (last < -0.5) html += '<div class="rc-warn">Сумма платежей больше стоимости квартиры — проверьте стоимость.</div>';
    return html + '</div>';
  }

  function readInputs() {
    return { base: parseMoney(el.price.value) || 0, finish: parseMoney(el.finish.value) || 0, extra: parseDisc(el.extra.value), pv: state.pv[state.project] };
  }

  function render() {
    var P = DATA[state.project];
    var inp = readInputs();
    if (!P) { el.grid.innerHTML = '<div class="rc-card rc-empty">Нет данных по проекту.</div>'; return; }
    if (!inp.base) { el.grid.innerHTML = '<div class="rc-card rc-empty">Укажите стоимость квартиры.</div>'; return; }
    var r = calcAll(P, inp);
    el.grid.innerHTML = card('noPv', r.noPv, P) + card('m5050', r.m5050, P) + card('t2020', r.t2020, P) + card('parents', r.parents, P);
    postHeight();
  }

  function postHeight() {
    if (window.parent === window) return;
    try { window.parent.postMessage({ ipotekaCalcHeight: Math.ceil(document.documentElement.scrollHeight) }, '*'); } catch (e) {}
  }

  function useData(map, source) {
    Object.keys(map).forEach(function (name) {
      var P = map[name];
      if (!validSheet(P)) return;
      DATA[name] = P;
      var opts = pvOptions(P);
      var has = function (x) { return x != null && opts.some(function (v) { return Math.abs(v - x) < 1e-9; }); };
      if (!has(state.pv[name])) state.pv[name] = has(P.m5050.p1) ? P.m5050.p1 : opts[0]; // по умолчанию — ПВ, выбранный на листе
    });
    if (!DATA[state.project]) state.project = CONFIG.projects[0].name;
    window.RassrochkaCalc.source = source;
    renderProjects();
    render();
  }

  function moneyInput(input) {
    input.addEventListener('input', function () {
      var v = parseMoney(input.value);
      var pos = input.value.length - input.selectionStart;
      input.value = v == null ? '' : nf0.format(v);
      try { var p = Math.max(0, input.value.length - pos); input.setSelectionRange(p, p); } catch (e) {}
      render();
    });
  }

  /* ---------- Сохранение в PDF ----------
     Отчёт собирается отдельно (A4 книжный), рисуется html2canvas и кладётся на лист jsPDF.
     Библиотеки подгружаются только по нажатию. От прокрутки и ширины экрана результат не зависит. */
  var PDF_LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ];
  var libsLoading = null;
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = res; s.onerror = function () { rej(new Error('load ' + src)); };
      document.head.appendChild(s);
    });
  }
  function loadPdfLibs() {
    if (window.html2canvas && window.jspdf) return Promise.resolve();
    if (!libsLoading) libsLoading = Promise.all(PDF_LIBS.map(loadScript)).then(function () {
      if (!window.html2canvas || !window.jspdf) throw new Error('libs');
    }).catch(function (e) { libsLoading = null; throw e; });
    return libsLoading;
  }

  // Логотип для PDF переводим в PNG: html2canvas неверно рисует SVG
  var logoPngCache = null;
  function logoPng() {
    if (logoPngCache) return Promise.resolve(logoPngCache);
    var svg = root.querySelector('.ipc-logo-svg');
    if (!svg) return Promise.resolve('');
    var c = svg.cloneNode(true);
    c.setAttribute('width', '1920'); c.setAttribute('height', '1410');
    var src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        try {
          var cv = document.createElement('canvas');
          cv.width = 480; cv.height = 352;
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          logoPngCache = cv.toDataURL('image/png');
        } catch (e) { logoPngCache = ''; }
        res(logoPngCache);
      };
      img.onerror = function () { res(''); };
      img.src = src;
    });
  }

  var PAGE_W = 794, PAGE_H = 1123; // A4 книжный при 96 dpi

  function buildReport(png) {
    var inp = readInputs(), P = DATA[state.project], r = calcAll(P, inp), now = new Date();
    var flat = el.flat.value.trim();
    var ds = now.toLocaleDateString('ru-RU') + ', ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    var item = function (k, v) { return '<div>' + k + '<b>' + v + '</b></div>'; };
    var page = document.createElement('div');
    page.className = 'rc-report';
    page.innerHTML =
      '<div class="rr-head"><div><div class="rr-title">Расчёт рассрочки</div>' +
        '<div class="rr-meta">' + esc(state.project) + (flat ? ' · кв. ' + esc(flat) : '') + ' · ' + ds + '</div></div>' +
        (png ? '<img class="rr-logo" src="' + png + '" width="55" height="40" alt="BAZA Development">' : '') + '</div>' +
      '<div class="rr-inputs">' + item('Проект', esc(state.project)) + (flat ? item('Номер квартиры', esc(flat)) : '') +
        item('Стоимость квартиры', rub(inp.base)) + (inp.finish ? item('Отделка', rub(inp.finish)) : '') +
        (inp.extra ? item('Доп. скидка', pct(inp.extra)) : '') + '</div>' +
      '<div class="rr-grid">' + card('noPv', r.noPv, P, true) + card('m5050', r.m5050, P, true) +
        card('t2020', r.t2020, P, true) + card('parents', r.parents, P, true) + '</div>';
    var file = ('Расчёт рассрочки ' + state.project + (flat ? ' кв ' + flat : '') + ' ' + now.toLocaleDateString('ru-RU'))
      .replace(/[\\/:*?"<>|]+/g, '-') + '.pdf';
    return { page: page, file: file };
  }

  function renderPage(page) {
    // Страница временно кладётся в левый верхний угол окна под содержимым сайта — посетитель её не видит
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:0;top:0;z-index:-2147483647;pointer-events:none;width:' + PAGE_W + 'px;';
    host.appendChild(page);
    document.body.appendChild(host);
    var done = function () { if (host.parentNode) host.parentNode.removeChild(host); };
    return window.html2canvas(page, {
      scale: 2, backgroundColor: '#F5F8FB', useCORS: true, logging: false,
      scrollX: 0, scrollY: 0, x: 0, y: 0, width: PAGE_W, height: Math.max(PAGE_H, page.offsetHeight),
      windowWidth: PAGE_W + 200, windowHeight: Math.max(PAGE_H, page.offsetHeight) + 200
    }).then(function (c) { done(); return c; }, function (e) { done(); throw e; });
  }

  function createPdf() {
    return Promise.all([loadPdfLibs(), logoPng()]).then(function (res) {
      var rep = buildReport(res[1]);
      return renderPage(rep.page).then(function (c) {
        var pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        var W = 210, H = 297;
        pdf.setFillColor(245, 248, 251); pdf.rect(0, 0, W, H, 'F');
        var k = Math.min(W / c.width, H / c.height), w = c.width * k, h = c.height * k;
        pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', (W - w) / 2, 0, w, h);
        return { pdf: pdf, file: rep.file };
      });
    });
  }

  function savePdf() {
    if (!readInputs().base || !DATA[state.project]) return;
    var btn = $('rc-save'), msg = $('rc-savemsg'), label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Готовлю PDF…'; msg.textContent = '';
    createPdf().then(function (r) {
      r.pdf.save(r.file);
    }).catch(function () {
      msg.textContent = 'Не удалось сохранить PDF. Нажмите «Распечатать расчёт» и выберите «Сохранить как PDF».';
    }).then(function () {
      btn.disabled = false; btn.textContent = label;
    });
  }

  window.RassrochkaCalc = { parseSheet: parseSheet, calcAll: calcAll, data: function () { return DATA; }, createPdf: createPdf };

  [el.price, el.finish].forEach(moneyInput);
  el.extra.addEventListener('input', function () {
    var v = cleanDisc(el.extra.value);
    if (v !== el.extra.value) el.extra.value = v;
    render();
  });
  el.project.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-p]'); if (!b) return;
    state.project = b.getAttribute('data-p'); renderProjects(); render();
  });
  el.grid.addEventListener('click', function (e) {
    var b = e.target.closest('[data-pv] button[data-v]'); if (!b) return;
    state.pv[state.project] = +b.getAttribute('data-v'); render();
  });
  $('rc-print').addEventListener('click', function () { window.print(); });
  $('rc-save').addEventListener('click', savePdf);
  window.addEventListener('resize', postHeight);

  el.price.value = CONFIG.defaults.price ? nf0.format(CONFIG.defaults.price) : '';
  var snap = {};
  CONFIG.projects.forEach(function (p) { if (SNAPSHOT[p.name]) snap[p.name] = parseSheet(SNAPSHOT[p.name]); });
  useData(snap, 'копия от 08.10.2026');

  if (CONFIG.liveData && window.fetch) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000);
    Promise.all(CONFIG.projects.map(function (p) {
      return gvizRows(p.sheet, ctrl ? ctrl.signal : undefined).then(function (rows) { return [p.name, parseSheet(rows)]; }, function () { return null; });
    })).then(function (list) {
      clearTimeout(timer);
      var map = {};
      list.forEach(function (x) { if (x) map[x[0]] = x[1]; });
      if (Object.keys(map).length) useData(map, 'таблица, ' + new Date().toLocaleString('ru-RU'));
    });
  }
})();
</script>
